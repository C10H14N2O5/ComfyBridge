[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "comfybridge"
version = "0.5.1"
description = "Local OpenAI-compatible TTS bridge for ComfyUI"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "C10H14N2O5" }]
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "rich>=13.9,<15",
]

[project.urls]
Repository = "https://github.com/C10H14N2O5/ComfyBridge"
Issues = "https://github.com/C10H14N2O5/ComfyBridge/issues"
Changelog = "https://github.com/C10H14N2O5/ComfyBridge/blob/main/CHANGELOG.md"

[project.scripts]
comfybridge = "comfybridge.launcher:main"

[dependency-groups]
dev = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "respx>=0.22,<1",
  "openai>=1.60,<3",
  "pyinstaller>=6.12,<7",
  # Build/test-only: installer smoke job objects and DACL verification tests.
  "pywin32>=308; sys_platform == 'win32'",
]

[tool.hatch.build.targets.wheel]
packages = ["src/comfybridge"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra"
