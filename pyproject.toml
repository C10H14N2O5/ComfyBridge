[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "comfybridge"
version = "0.4.1"
description = "Local OpenAI-compatible TTS bridge for ComfyUI"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "rich>=13.9,<15",
  "pywin32>=308; sys_platform == 'win32'",
]

[project.scripts]
comfybridge = "comfybridge.launcher:main"

[dependency-groups]
dev = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "respx>=0.22,<1",
  "openai>=1.60,<3",
  "pyinstaller>=6.12,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/comfybridge"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra"
