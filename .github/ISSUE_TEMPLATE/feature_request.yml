name: 功能建议 / Feature request
description: 建议新功能或改进 / Suggest a new feature or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        提交前请先查看 README 中的“已知限制”和“路线图”，并搜索是否已有相同建议。

        Before submitting, please check "Known limitations" and "Roadmap" in the README and search for existing requests.
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题 / Problem
      description: 你遇到了什么限制或场景？ / What limitation or use case do you have?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案 / Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 其他方案 / Alternatives considered
  - type: input
    id: client
    attributes:
      label: 相关调用端或工作流 / Related client or workflow
      placeholder: "AstrBot / Open WebUI / IndexTTS 2.5 ..."
  - type: textarea
    id: context
    attributes:
      label: 补充信息 / Additional context
