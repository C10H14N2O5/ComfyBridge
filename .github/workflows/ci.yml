name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (Windows, Python 3.13)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --frozen --python 3.13

      - name: Cache pinned FFmpeg
        uses: actions/cache@v4
        with:
          path: artifacts/vendor
          key: ffmpeg-${{ hashFiles('scripts/ffmpeg-manifest.json', 'scripts/fetch_ffmpeg.ps1') }}

      - name: Fetch and verify pinned FFmpeg
        shell: pwsh
        run: |
          ./scripts/fetch_ffmpeg.ps1
          $bin = Resolve-Path 'artifacts/vendor/ffmpeg-pinned/ffmpeg-n8.1.3-23-g5c4f5744cd-win64-lgpl-shared-8.1/bin'
          Add-Content -Path $env:GITHUB_PATH -Value $bin

      - name: Run tests
        shell: pwsh
        run: .venv\Scripts\python.exe -m pytest -q
